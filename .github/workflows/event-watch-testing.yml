# Calls the Event Watch testing deployment every six hours.
# This workflow must be on the default branch before GitHub will run the schedule.
# It does not change production and does not disable Vercel Deployment Protection.

name: Event Watch testing checks

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: event-watch-testing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the testing Event Watch endpoint
        env:
          EVENT_WATCH_URL: ${{ secrets.EVENT_WATCH_TESTING_URL }}
          CRON_SECRET: ${{ secrets.EVENT_WATCH_CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python3 - << 'PY'
          import json, os, urllib.error, urllib.request
          from urllib.parse import urlparse

          url = os.environ.get("EVENT_WATCH_URL", "").strip()
          secret = os.environ.get("CRON_SECRET", "")
          bypass = os.environ.get("VERCEL_AUTOMATION_BYPASS_SECRET", "")
          if not url or not secret or not bypass:
              raise SystemExit("Event Watch testing secrets are not configured")

          parsed = urlparse(url)
          host = parsed.hostname or ""
          if (
              parsed.scheme != "https"
              or not host.endswith(".vercel.app")
              or parsed.username
              or parsed.password
              or parsed.path.rstrip("/") != "/api/cron/event-watch"
          ):
              raise SystemExit("EVENT_WATCH_TESTING_URL must be https://<preview>.vercel.app/api/cron/event-watch")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise SystemExit(f"Refusing to follow redirect ({code})")

          headers = {
              "Authorization": f"Bearer {secret}",
              "Accept": "application/json",
              "x-vercel-protection-bypass": bypass,
          }
          request = urllib.request.Request(url, headers=headers, method="GET")
          opener = urllib.request.build_opener(NoRedirect)
          try:
              with opener.open(request, timeout=280) as response:
                  status = response.status
                  body = response.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as error:
              status = error.code
              body = error.read().decode("utf-8", errors="replace")
          print(f"HTTP {status}")
          print(body[:4000])
          if status < 200 or status >= 300:
              raise SystemExit(1)
          payload = json.loads(body)
          if payload.get("success") is not True or int(payload.get("failed") or 0) > 0:
              raise SystemExit(1)
          PY
